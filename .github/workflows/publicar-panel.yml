# Publica el panel (carpeta panel/ + datos de data/) en GitHub Pages.
# Corre solo cuando se cambia el panel y después de cada vuelta de un bot.
name: Publicar panel

on:
  push:
    branches: [main]
    paths: ["panel/**", "data/**", "config/acreditacion.json", ".github/workflows/publicar-panel.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # trae los datos recién guardados por el bot
      - name: Armar el sitio
        run: |
          mkdir _sitio
          cp -r panel/* _sitio/
          cp -r data _sitio/data
          cp config/acreditacion.json _sitio/data/acreditacion.json
          rm -f _sitio/data/vistos.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      # GitHub a veces tarda en "ver" el paquete recién subido y falla: se espera y se reintenta (hasta 2 veces más)
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
