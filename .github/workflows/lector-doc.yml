# LECTOR DEL DOC: cada hora lee "Resultados desde Claude" (publicado en la web) y actualiza el panel.
# Tarda unos segundos. Solo guarda si el Doc cambió.
name: Lector del Doc

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, al minuto 7
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cambio: ${{ steps.guardar.outputs.cambio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bots/requirements.txt
      - run: pip install -r bots/requirements.txt
      - run: python -m bots.doc_resultados.main
      - name: Medallero oficial
        run: python -m bots.medallero.main
        continue-on-error: true
      - name: Eventos en Buenos Aires (planilla)
        run: python -m bots.eventos_ba.main
        continue-on-error: true
      - name: Eventos cargados a mano en el panel
        run: python -m bots.eventos_manuales.main
        continue-on-error: true
      - id: guardar
        name: Guardar si cambió
        run: |
          git config user.name "bot-argentina-dorada"
          git config user.email "bot@users.noreply.github.com"
          git add data/doc-resultados.json data/ultima-corrida.json data/doc-terminados.json data/vencidos.json data/medalleros.json data/eventos-manuales.json data/eventos-ba.json data/agregados.json
          if git diff --cached --quiet -- data/doc-resultados.json data/vencidos.json data/doc-terminados.json data/medalleros.json data/eventos-manuales.json data/eventos-ba.json data/agregados.json; then
            echo "cambio=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Doc: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash && git push
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: leer
    if: needs.leer.outputs.cambio == 'si'
    uses: ./.github/workflows/publicar-panel.yml
