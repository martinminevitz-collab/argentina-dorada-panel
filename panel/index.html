<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel Argentina Dorada</title>
  <meta name="theme-color" content="#F6F3EC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="top">
    <div class="marca">
      <img src="iconos/icono.svg" alt="" width="40" height="40">
      <div>
        <h1>ARGENTINA DORADA</h1>
        <p class="sub">Panel de bots</p>
      </div>
    </div>
    <button id="recargar" class="icono-btn" title="Actualizar" aria-label="Actualizar">↻</button>
  </header>

  <div class="cuerpo">
    <aside class="lateral">
      <section id="estado" class="estado" aria-live="polite">Cargando…</section>

      <section id="cuenta" class="cuenta" hidden>
        <form id="form-entrar">
          <label for="mail">Entrá con tu mail para que "Publicado" lo vean todos</label>
          <div class="fila-entrar"><input id="mail" type="email" placeholder="tu@mail.com" autocomplete="email" required><button>Entrar</button></div>
        </form>
        <div id="sesion" hidden><span id="sesion-txt"></span> <button id="salir" class="link-btn">Salir</button></div>
        <p id="cuenta-msj" class="ayuda" aria-live="polite"></p>
      </section>

      <nav class="pestanas" role="tablist">
        <span id="tabs-multi"></span>
        <button role="tab" data-tab="resultados" class="activa">Resultados <span class="n"></span></button>
        <button role="tab" data-tab="agenda">Agenda <span class="n"></span></button>
        <button role="tab" data-tab="radar">Radar del bot <span class="n"></span></button>
      </nav>

      <section class="filtros">
        <div class="chips-filtro" id="filtro-estado" data-para="resultados">
          <button data-v="" class="activo">Todos</button>
          <button data-v="publicable">Publicables</button>
          <button data-v="en_curso">En curso</button>
          <button data-v="mas_info">Falta info</button>
        </div>
        <div class="chips-filtro" id="filtro-tipo" data-para="radar" hidden>
          <button data-v="" class="activo">Todo</button>
          <button data-v="resultado">Resultados</button>
          <button data-v="agenda">Agenda</button>
          <button data-v="ba">📍 Bs. As.</button>
        </div>
        <input id="buscar" type="search" placeholder="Buscar (nombre, torneo…)" aria-label="Buscar">
        <div class="fila">
          <select id="deporte" aria-label="Deporte"><option value="">Todos los deportes</option></select>
          <select id="rango" aria-label="Días" data-para="radar" hidden>
            <option value="1">Hoy</option>
            <option value="3" selected>Últimos 3 días</option>
            <option value="7">Última semana</option>
          </select>
        </div>
        <label class="check" data-para="resultados agenda"><input id="ver-publicados" type="checkbox"> Mostrar los que ya publiqué</label>
        <p class="ayuda" data-para="radar" hidden>Noticias sueltas que junta el bot. Son la materia prima del agente: lo que sirve aparece después en Resultados.</p>
      </section>
    </aside>

    <main id="lista" class="lista"></main>
  </div>

  <template id="tpl-evento">
    <article class="evento">
      <button class="cabeza" aria-expanded="false">
        <span class="chips"><span class="chip deporte"></span><span class="chip etiqueta"></span><span class="chip novedad" hidden>Novedades</span></span>
        <span class="titulo"></span>
        <span class="fechas"></span>
        <span class="flecha" aria-hidden="true">▾</span>
      </button>
      <div class="detalle" hidden></div>
      <div class="pie">
        <button class="copiar">Copiar</button>
        <button class="publicado">Publicado</button>
      </div>
    </article>
  </template>

  <template id="tpl-noticia">
    <article class="noticia">
      <div class="chips"><span class="chip deporte"></span><span class="chip tipo"></span><span class="chip ba" hidden>📍 Bs. As.</span></div>
      <h2><a target="_blank" rel="noopener"></a></h2>
      <span class="meta"></span>
    </article>
  </template>

  <div id="aviso" class="aviso" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="base.js"></script>
  <script src="app.js"></script>
</body>
</html>
